name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run pipeline
        run: python run_pipeline.py

      - name: Upload benefits summary and Power BI extracts
        uses: actions/upload-artifact@v4
        with:
          name: fraud-alert-triage-outputs
          path: |
            outputs/
            docs/benefits_summary.md
            prototype/workbench.html
